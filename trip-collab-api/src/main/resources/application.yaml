server:
  port: ${PORT:8082}

spring:
  application:
    name: trip-collab-api

  datasource:
    url: "${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:trip_collab}}"
    username: "${DB_USER:${PGUSER:postgres}}"
    password: "${DB_PASSWORD:${PGPASSWORD:postgres}}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "baseline existing schema"
